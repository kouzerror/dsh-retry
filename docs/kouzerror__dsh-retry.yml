url: https://github.com/kouzerror/dsh-retry
name: kouzerror/dsh-retry
category: ui
description:
  en: 'Adds a native Restart DeepSeek Harness item to the Windows system tray menu and the account menu of the DSH desktop app, plus an official settings-page entry that keeps working after a desktop update: the plugin prepares a patched resources/app.asar at startup and installs it by briefly restarting the desktop app once (the running app keeps the archive locked, so it can never be replaced in place), re-applies the patch automatically after each desktop update, and every entry relaunches the app gracefully. Windows desktop only; other hosts report 409 not_desktop.'
  zh: '给 DSH 桌面端的 Windows 系统托盘菜单和账户菜单各加一项原生「重启 DeepSeek Harness」，另在设置页提供官方插件入口（桌面端更新后依然可用）：插件启动时准备好补丁版 resources/app.asar，并通过短暂重启一次桌面端把它装进去（运行中的 app 锁着 asar，无法就地替换），桌面端每次更新覆盖后自动重装补丁，点击任一项走 app.relaunch() 优雅重启。仅支持 Windows 桌面端，其它宿主返回 409 not_desktop。'
