url: https://github.com/kouzerror/dsh-retry
name: kouzerror/dsh-retry
category: ui
description:
  en: 'Adds a native Restart DeepSeek Harness item to the Windows system tray menu and the account menu of the DSH desktop app: the plugin prepares a patched resources/app.asar at startup and installs it by briefly restarting the desktop app once (the running app keeps the archive locked, so it can never be replaced in place), the patch is re-applied automatically after each desktop update, and either item relaunches the app gracefully. Windows desktop only; other hosts report 409 not_desktop.'
  zh: '给 DSH 桌面端的 Windows 系统托盘菜单和账户菜单各加一项原生「重启 DeepSeek Harness」：插件启动时准备好补丁版 resources/app.asar，并通过短暂重启一次桌面端把它装进去（运行中的 app 锁着 asar，无法就地替换），桌面端每次更新覆盖后自动重装补丁，点击任一项走 app.relaunch() 优雅重启。仅支持 Windows 桌面端，其它宿主返回 409 not_desktop。'
