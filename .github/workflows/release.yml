name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Test, pack and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --generate-notes diffs the new tag against the previous one, so the
          # full history and every tag must be fetched.
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package.json version ${pkg_version}"

      - name: Syntax check
        run: node scripts/check-syntax.mjs

      - name: Unit tests
        run: npm test

      - name: Pack tarball
        run: npm pack

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dsh-retry-*.tgz)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::npm pack produced no dsh-retry-*.tgz"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, uploading assets with --clobber"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "dsh-retry ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi